<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1" />
      <stop offset="50%" stop-color="#45a29e" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo circular oscuro -->
  <rect width="512" height="512" rx="128" fill="#0b0c10" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonGrad)" stroke-width="12" opacity="0.6" />
  
  <!-- Nota musical y onda sonora -->
  <g filter="url(#glow)">
    <!-- Disco vinilo / aurícula -->
    <circle cx="256" cy="256" r="160" fill="#12151c" stroke="#1f2833" stroke-width="8" />
    
    <!-- Ondas concéntricas -->
    <circle cx="256" cy="256" r="120" fill="none" stroke="#45a29e" stroke-width="3" stroke-dasharray="12 12" opacity="0.4" />
    <circle cx="256" cy="256" r="85" fill="none" stroke="#66fcf1" stroke-width="2" opacity="0.3" />

    <!-- Nota musical doble estilizada -->
    <path d="M220 320 A 30 25 0 1 1 190 295 L 190 170 L 310 140 L 310 280 A 30 25 0 1 1 280 255 L 280 185 L 220 200 Z" fill="url(#neonGrad)" />
  </g>
</svg>
